[graph]
all-features = true
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive build-time macro dependency" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
# Workspace packages are Apache-2.0 (see the root LICENSE). The release NOTICE
# generator inventories them separately from third-party terms.
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
