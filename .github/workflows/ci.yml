name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License headers
        run: scripts/license-headers.sh
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler jq
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p zeta4j -p zeta4j-cli
      - run: scripts/e2e-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/zeta4j.Dockerfile -t zeta4j:ci .
      - name: Container starts and answers
        run: |
          docker run -d --name zeta4j -p 9044:9044 \
            -e ZETA4J_BOOTSTRAP_USERNAME=admin -e ZETA4J_BOOTSTRAP_PASSWORD=ci-password-1234 zeta4j:ci
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:9044/health && exit 0
            sleep 2
          done
          docker logs zeta4j
          exit 1
